spring.application.name=ms-usuarios-test

# Base de datos en memoria (H2) solo para las pruebas: no necesitan MySQL.
spring.datasource.url=jdbc:h2:mem:usuarios;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=clave-de-pruebas-unitarias-con-mas-de-32-caracteres-123456
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=*
