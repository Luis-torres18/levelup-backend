spring.application.name=ms-gestion-usuarios
server.port=8083

# --- Base de datos MySQL ---
# En Docker Compose se sobreescriben con variables de entorno (DB_URL, DB_USER, DB_PASSWORD).
# Si corres el microservicio en tu PC sin Docker, usa estos valores por defecto (MySQL local).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Seguridad (JWT) ---
# Debe ser la MISMA clave en los 3 microservicios. Mínimo 32 caracteres.
app.jwt.secret=${JWT_SECRET:levelup-gamer-clave-secreta-desarrollo-cambiar-en-produccion-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- CORS ---
# Orígenes permitidos separados por coma, ej: http://mi-bucket.s3-website-us-east-1.amazonaws.com,http://localhost:5173
app.cors.allowed-origins=${CORS_ORIGINS:*}
